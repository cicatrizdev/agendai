id: bug-001
family: bug
report: Não consigo marcar às 10h se já tem alguém até as 10h.
prompt: |
  Relato de cliente: "Não consigo marcar às 10h se já tem alguém até as 10h."
  Escreva primeiro um teste que reproduz o problema e depois corrija.
setup:
  bug: bug-001
contract:
  allowed_paths: ["apps/api/src/domain/**", "apps/api/test/**"]
  max_diff_lines: 80
graders:
  - type: fail_to_pass
    tests: [apps/api/test/hidden/overlap-boundary.test.ts]
  - type: pass_to_pass
  - type: must_add_failing_test
  - type: invariant
    rules: [verify_before_finish, no_forbidden_paths]
expected_outcome: fix
