id: bug-004
family: bug
prompt: |
  Relato de cliente: "Na segunda página some uma reserva."
  Escreva primeiro um teste que reproduz o problema e depois corrija.
setup:
  bug: bug-004
contract:
  allowed_paths: ["apps/api/src/domain/**", "apps/api/test/**"]
  max_diff_lines: 80
graders:
  - type: fail_to_pass
    tests: [apps/api/test/hidden/cursor-pagination.test.ts]
  - type: pass_to_pass
  - type: must_add_failing_test
  - type: invariant
    rules: [verify_before_finish, no_forbidden_paths]
expected_outcome: fix
